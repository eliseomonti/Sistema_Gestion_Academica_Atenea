<main class="login">
  <header class="cabecera">
    <img
      class="logo"
      src="img/atenea-logo-centrado-bajo-blanco.svg"
      alt="Atenea, Sistema de Gestión Académica"
    />
    <h1>{{ titulo() }}</h1>
  </header>

  <form class="tarjeta" [formRoot]="loginForm">
    <div class="campo">
      <label for="username">Usuario</label>
      <input id="username" type="text" autocomplete="username" [formField]="loginForm.username" />
      @if (loginForm.username().touched() && loginForm.username().invalid()) {
        <p class="error-campo">{{ loginForm.username().errors()[0].message }}</p>
      }
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <div class="con-boton">
        <input
          id="password"
          [type]="mostrarPassword() ? 'text' : 'password'"
          autocomplete="current-password"
          [formField]="loginForm.password"
        />
        <button
          type="button"
          class="ver-password"
          [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          [attr.aria-pressed]="mostrarPassword()"
          (click)="mostrarPassword.set(!mostrarPassword())"
        >
          <app-icono [nombre]="mostrarPassword() ? 'ojo' : 'ojo-tachado'" />
        </button>
      </div>
      @if (loginForm.password().touched() && loginForm.password().invalid()) {
        <p class="error-campo">{{ loginForm.password().errors()[0].message }}</p>
      }
    </div>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" [disabled]="loginForm().submitting()">Ingresar</button>
  </form>
</main>
