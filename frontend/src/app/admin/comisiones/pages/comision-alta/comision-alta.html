<dialog #dialogo class="ventana" (close)="volver()">
    <h2>Nueva Comision</h2>
    @if(creada())
    {
        <p class="bien">Se creo la comision {{creada()}}</p>
        <button (click)="cerrar()">Listo</button>
    }@else 
    {
        <form [formRoot]="comisionForm">
            <label>
                Año
                <select [formField]="comisionForm.anioCursado">
                    <option value="">Eligi una opcion</option>
                    @for(anio of anios; track anio)
                    {
                        <option [value]="anio">{{anio}}</option>
                    }
                </select>
            </label>

            <label>
                Número
                <input type="number" [formField]="comisionForm.nroComision"/>
            </label>

            <label>
                Turno
                <select [formField]="comisionForm.turno">
                    <option value="">Elegí</option>
                    @for(turno of turnos; track turno)
                    {
                        <option [value]="turno">{{turno | turno}}</option>
                    }
                </select>
            </label>

            <label>
                Año lectivo
                <input type="number" [formField]="comisionForm.anioLectivo"/>
            </label>

            @if(comisionForm().touched() && comisionForm().invalid())
            {
                <p class="error">Completa todos los datos</p>
            }

            <button [disabled]="cargando()">Crear</button>
            <button type="button" (click)="cerrar()">Cancelar</button>
        </form>
    }

    @if(error())
    {
        <p class="error">{{error()}}</p>
    }
</dialog>
