@if (totalPaginas() > 1) {
  <nav aria-label="Páginas">
    <button
      type="button"
      aria-label="Página anterior"
      [disabled]="pagina() === 0"
      (click)="cambiar.emit(pagina() - 1)"
    >
      <app-icono nombre="flecha-izquierda" />
    </button>

    <!-- Para la persona, las páginas empiezan en 1. aria-live: el lector de pantalla lee el cambio. -->
    <span aria-live="polite">Página {{ pagina() + 1 }} de {{ totalPaginas() }}</span>

    <button
      type="button"
      aria-label="Página siguiente"
      [disabled]="pagina() >= totalPaginas() - 1"
      (click)="cambiar.emit(pagina() + 1)"
    >
      <app-icono nombre="flecha-derecha" />
    </button>
  </nav>
}
