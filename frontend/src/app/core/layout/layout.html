<!-- Barra de celular y tablet, para abrir el menú. En escritorio se oculta: el menú se ve siempre. -->
<header class="barra">
  <button
    type="button"
    class="hamburguesa"
    aria-controls="menu-principal"
    [attr.aria-expanded]="menuAbierto()"
    [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'"
    (click)="menuAbierto.set(!menuAbierto())"
  >
    <app-icono [nombre]="menuAbierto() ? 'cerrar' : 'menu'" />
  </button>
  <!-- En la barra, la marca va en horizontal: el logo al lado del texto. Lleva al inicio. -->
  <a class="marca" [routerLink]="inicio" aria-label="Atenea: ir al inicio">
    <img class="marca-icono" src="img/atenea-icono-blanco.svg" alt="" />
    <div>
      <img class="marca-letras" src="img/atenea-letras.svg" alt="Atenea" />
      <p class="marca-modulo">{{ modulo }}</p>
    </div>
  </a>
</header>

<aside id="menu-principal" class="lateral" [class.abierto]="menuAbierto()">
  <!-- En el menú, la marca va en vertical y centrada. En celular ya está en la barra. Lleva al
       inicio. -->
  <a class="marca-lateral" [routerLink]="inicio" aria-label="Atenea: ir al inicio">
    <img class="lateral-icono" src="img/atenea-icono-blanco.svg" alt="" />
    <img class="lateral-letras" src="img/atenea-letras.svg" alt="Atenea" />
    <p class="lateral-modulo">{{ modulo }}</p>
  </a>

  <app-menu [items]="menu" (elegido)="menuAbierto.set(false)" />

  <button type="button" class="salir" (click)="salir()">Salir</button>
</aside>

<main class="contenido">
  <router-outlet />
</main>
