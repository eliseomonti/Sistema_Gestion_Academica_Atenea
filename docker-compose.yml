services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./bdd/atenea_db_script.sql:/docker-entrypoint-initdb.d/00-esquema.sql:ro
      - ./bdd/01-carreras.sql:/docker-entrypoint-initdb.d/01-carreras.sql:ro
      - ./bdd/02-personas.sql:/docker-entrypoint-initdb.d/02-personas.sql:ro
      - ./bdd/03-aulas.sql:/docker-entrypoint-initdb.d/03-aulas.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/atenea_db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mysql-data:
