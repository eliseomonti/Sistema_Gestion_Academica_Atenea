spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/atenea_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.forward-headers-strategy=framework
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Config propia de cada PC (ignorada por git): si existe, pisa lo de arriba
spring.config.import=optional:classpath:application-local.properties

# Clave para firmar los JWT (minimo 32 caracteres). El valor por defecto es SOLO para desarrollo:
# en produccion se define la variable de entorno JWT_SECRET.
atenea.jwt.secret=${JWT_SECRET:clave-de-desarrollo-no-usar-en-produccion-0123456789}
# Duracion de los tokens (formato de Spring: 15m, 7d, etc.)
atenea.jwt.access-token-duration=15m
atenea.jwt.refresh-token-duration=7d

# Cuanto dura la regularidad de una cursada desde el acta de cierre (formato de Spring: 2y, 18m, etc.).
# Se guarda en cada acta: cambiarla no reescribe la de las actas ya cerradas.
atenea.regularidad.vigencia=2y

# Mails (Resend). Sin RESEND_API_KEY no se manda nada: solo se loguea.
# Sin dominio verificado, Resend solo acepta onboarding@resend.dev como remitente y tu propio mail como destino.
# MAIL_REDIRIGIR_A: si tiene valor, todos los mails van a esa direccion (para probar con usuarios de mails falsos).
atenea.mail.resend-api-key=${RESEND_API_KEY:}
atenea.mail.remitente=${MAIL_REMITENTE:Atenea <onboarding@resend.dev>}
atenea.mail.redirigir-a=${MAIL_REDIRIGIR_A:}
# Direccion de la app que aparece en los mails
atenea.mail.url-app=${URL_APP:http://localhost:4200}

# Paginacion de los listados: si Angular pide mas filas, se devuelven como maximo estas
spring.data.web.pageable.max-page-size=100
