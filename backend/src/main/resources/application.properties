spring.datasource.url=jdbc:mysql://localhost:3306/atenea_db
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Config propia de cada PC (ignorada por git): si existe, pisa lo de arriba
spring.config.import=optional:classpath:application-local.properties

# Clave para firmar los JWT (minimo 32 caracteres). El valor por defecto es SOLO para desarrollo:
# en produccion se define la variable de entorno JWT_SECRET.
atenea.jwt.secret=${JWT_SECRET:clave-de-desarrollo-no-usar-en-produccion-0123456789}
# Origenes desde donde Angular puede llamar a la API (separados por coma)
atenea.cors.allowed-origins=http://localhost:4200
# Duracion de los tokens (formato de Spring: 15m, 7d, etc.)
atenea.jwt.access-token-duration=15m
atenea.jwt.refresh-token-duration=7d

# Cuanto dura la regularidad de una cursada desde el acta de cierre (formato de Spring: 2y, 18m, etc.).
# Se guarda en cada acta: cambiarla no reescribe la de las actas ya cerradas.
atenea.regularidad.vigencia=2y

# Paginacion de los listados: si Angular pide mas filas, se devuelven como maximo estas
spring.data.web.pageable.max-page-size=100
