name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  TZ: America/Argentina/Buenos_Aires
  REGISTRO: ghcr.io/eliseomonti
  GRUPO_AZURE: rg-atenea
  URL_PRODUCCION: https://atenea-frontend.calmcliff-ac059761.chilecentral.azurecontainerapps.io

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          TZ: America/Argentina/Buenos_Aires
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - name: Cargar la base de datos
        run: |
          for f in atenea_db_script 01-carreras 02-personas 03-aulas; do
            mysql -h 127.0.0.1 -uroot -proot --default-character-set=utf8mb4 < bdd/$f.sql
          done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Tests
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    name: Frontend (lint, tests y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx ng test --watch=false
      - run: npm run build

  deploy:
    name: Deploy a Azure
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: ${{ env.URL_PRODUCCION }}
    concurrency:
      group: deploy-produccion
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Etiqueta de las imagenes (hash corto del commit)
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          provenance: false
          tags: ${{ env.REGISTRO }}/atenea-backend:${{ env.TAG }}

      - name: Imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          provenance: false
          tags: ${{ env.REGISTRO }}/atenea-frontend:${{ env.TAG }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Actualizar las Container Apps
        run: |
          az extension add -n containerapp --upgrade -y --only-show-errors
          az containerapp update -n atenea-backend -g "$GRUPO_AZURE" --image "$REGISTRO/atenea-backend:$TAG" -o none
          az containerapp update -n atenea-frontend -g "$GRUPO_AZURE" --image "$REGISTRO/atenea-frontend:$TAG" -o none

      - name: Verificar que la app responde
        run: |
          for i in $(seq 1 30); do
            web=$(curl -s -o /dev/null -w '%{http_code}' "$URL_PRODUCCION/")
            api=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL_PRODUCCION/api/auth/login" \
              -H 'Content-Type: application/json' -d '{"username":"x","password":"x"}')
            echo "intento $i: web=$web api=$api"
            if [ "$web" = 200 ] && [ "$api" = 401 ]; then exit 0; fi
            sleep 10
          done
          echo "La app no respondio como se esperaba"; exit 1
