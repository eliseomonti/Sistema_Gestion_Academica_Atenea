services:
  mysql:
    restart: unless-stopped
    ports: !reset []
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el .env}

  backend:
    restart: unless-stopped
    ports: !reset []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el .env}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el .env}

  frontend:
    restart: unless-stopped
    ports: !reset []

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO en el .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  caddy-data:
  caddy-config:
