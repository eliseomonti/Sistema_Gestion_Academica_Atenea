<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casos de uso corregidos</title>
<style>
  body { font-family: Arial, sans-serif; background: #fff; color: #1a1a1a; margin: 0; padding: 24px 16px; }
  main { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.hint { color: #555; margin: 0 0 24px; font-size: 14px; }
  section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 32px; }
  h2 { font-size: 16px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  button { background: #1a73e8; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .diagram svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<main>
  <h1>Diagramas de casos de uso corregidos</h1>
  <p class="hint">Tocá "Descargar PNG" en cada diagrama y reemplazá la imagen en el documento.</p>
  <section>
    <h2>Docente <button data-target="docente" data-name="casos-de-uso-docente.png">Descargar PNG</button></h2>
    <div class="diagram" id="docente"></div>
  </section>
  <section>
    <h2>Estudiante <button data-target="estudiante" data-name="casos-de-uso-estudiante.png">Descargar PNG</button></h2>
    <div class="diagram" id="estudiante"></div>
  </section>
</main>
<script>
const W = 1600;
const UC = { cx: 767, rx: 306, ry: 46, fill: '#e8f1fb', stroke: '#2f5b93' };
const EX = { cx: 1352, rx: 195, ry: 46, fill: '#fdf3e1', stroke: '#b8862b' };
const BUS_X = 351;

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function text(lines, x, y, size, extra = '') {
  const gap = size * 1.3;
  const start = y - (lines.length - 1) * gap / 2;
  return lines.map((l, i) =>
    `<text x="${x}" y="${start + i * gap}" font-size="${size}" text-anchor="middle" dominant-baseline="middle" ${extra}>${esc(l)}</text>`
  ).join('');
}

function ellipse(e, y, lines) {
  return `<ellipse cx="${e.cx}" cy="${y}" rx="${e.rx}" ry="${e.ry}" fill="${e.fill}" stroke="${e.stroke}" stroke-width="2.5"/>` +
    text(lines, e.cx, y, 20, 'fill="#1a1a1a"');
}

function actor(name, y) {
  const x = 182;
  return `<g stroke="#1a1a1a" stroke-width="2.5" fill="none">
    <circle cx="${x}" cy="${y - 37}" r="18" fill="#fff"/>
    <line x1="${x}" y1="${y - 19}" x2="${x}" y2="${y + 31}"/>
    <line x1="${x - 31}" y1="${y}" x2="${x + 31}" y2="${y}"/>
    <line x1="${x}" y1="${y + 31}" x2="${x - 26}" y2="${y + 70}"/>
    <line x1="${x}" y1="${y + 31}" x2="${x + 26}" y2="${y + 70}"/>
  </g>
  <text x="${x}" y="${y + 98}" font-size="21" font-weight="bold" text-anchor="middle" fill="#1a1a1a">${esc(name)}</text>
  <line x1="${x + 31}" y1="${y}" x2="${BUS_X}" y2="${y}" stroke="#333" stroke-width="2"/>`;
}

// Línea punteada entre el caso base y el óvalo naranja.
// include: la flecha apunta al óvalo naranja. extend: apunta al caso base.
function relation(kind, y) {
  const x1 = UC.cx + UC.rx, x2 = EX.cx - EX.rx;
  const head = kind === 'include'
    ? `${x2 - 13},${y - 8} ${x2},${y} ${x2 - 13},${y + 8}`
    : `${x1 + 13},${y - 8} ${x1},${y} ${x1 + 13},${y + 8}`;
  return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#444" stroke-width="2" stroke-dasharray="7 5"/>
    <polyline points="${head}" fill="none" stroke="#444" stroke-width="2.5"/>
    <text x="${(x1 + x2) / 2}" y="${y - 15}" font-size="15" text-anchor="middle" fill="#444">«${kind}»</text>`;
}

function diagram({ name, cases, step, first }) {
  const ys = cases.map((_, i) => first + i * step);
  const last = ys[ys.length - 1];
  const H = last + 90;
  const actorY = (first + last) / 2;
  let body = `<rect x="430" y="31" width="1138" height="${H - 31 - 30}" rx="6" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="10 6"/>
    <text x="999" y="61" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">Sistema ATENEA</text>
    <line x1="${BUS_X}" y1="${first}" x2="${BUS_X}" y2="${last}" stroke="#333" stroke-width="2"/>`;
  cases.forEach((c, i) => {
    const y = ys[i];
    body += `<line x1="${BUS_X}" y1="${y}" x2="${UC.cx - UC.rx}" y2="${y}" stroke="#333" stroke-width="2"/>`;
    body += ellipse(UC, y, c.lines);
    if (c.rel) {
      body += relation(c.rel.kind, y);
      body += ellipse(EX, y, c.rel.lines);
    }
  });
  body += actor(name, actorY);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="Arial, Helvetica, sans-serif">
    <rect width="${W}" height="${H}" fill="#ffffff"/>${body}</svg>`;
}

const docente = diagram({
  name: 'Docente', first: 143, step: 125,
  cases: [
    { lines: ['Ver materias asignadas y alumnos anotados (RF11)'] },
    { lines: ['Crear, modificar y borrar evaluaciones (RF12–RF13)'] },
    { lines: ['Cargar y corregir notas de cursada (RF14)'],
      rel: { kind: 'include', lines: ['Verificar que el acta', 'esté abierta (RN05)'] } },
    { lines: ['Cerrar acta de cursada (RF15)'],
      rel: { kind: 'include', lines: ['Fijar vencimiento de', 'regularidad a 2 años (RN04)'] } },
    { lines: ['Ver mesas de final como tribunal (RF16)'] },
    { lines: ['Cargar y corregir notas de finales (RF17)'] },
  ]
});

const estudiante = diagram({
  name: 'Estudiante', first: 143, step: 117,
  cases: [
    { lines: ['Consultar oferta de materias para cursar (RF18)'] },
    { lines: ['Inscribirse a una comisión (RF19)'],
      rel: { kind: 'include', lines: ['Validar correlativas,', 'cupo y período'] } },
    { lines: ['Darse de baja de una comisión (RF19)'] },
    { lines: ['Consultar mesas de final disponibles (RF20)'] },
    { lines: ['Inscribirse a una mesa de final (RF21)'],
      rel: { kind: 'include', lines: ['Validar regularidad', 'vigente (RN04)'] } },
    { lines: ['Darse de baja de una mesa de final (RF21)'] },
    { lines: ['Ver estado de materias y avance (RF22)'] },
    { lines: ['Consultar historial de cursadas (RF23)'] },
    { lines: ['Consultar finales rendidos y notas (RF24)'] },
  ]
});

document.getElementById('docente').innerHTML = docente;
document.getElementById('estudiante').innerHTML = estudiante;

function download(targetId, fileName) {
  const svgEl = document.querySelector('#' + targetId + ' svg');
  const w = +svgEl.getAttribute('width'), h = +svgEl.getAttribute('height');
  const data = new XMLSerializer().serializeToString(svgEl);
  const img = new Image();
  img.onload = () => {
    const scale = 2;
    const canvas = document.createElement('canvas');
    canvas.width = w * scale; canvas.height = h * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0, w, h);
    const link = document.createElement('a');
    link.download = fileName;
    link.href = canvas.toDataURL('image/png');
    link.click();
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(data);
}
document.querySelectorAll('button[data-target]').forEach(b =>
  b.addEventListener('click', () => download(b.dataset.target, b.dataset.name)));
</script>
</body>
</html>
