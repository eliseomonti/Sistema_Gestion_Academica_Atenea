<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagrama de actividades</title>
<style>
  body { font-family: Arial, sans-serif; background: #fff; color: #1a1a1a; margin: 0; padding: 24px 16px; }
  main { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.hint { color: #555; margin: 0 0 24px; font-size: 14px; }
  section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
  h2 { font-size: 16px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  button { background: #1a73e8; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .diagram svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<main>
  <h1>Diagrama de actividades corregido</h1>
  <p class="hint">Tocá "Descargar PNG" y reemplazá la imagen en el documento.</p>
  <section>
    <h2>Inscripción y rendición de final <button id="descargar">Descargar PNG</button></h2>
    <div class="diagram" id="actividades"></div>
  </section>
</main>
<script>
const W = 1436, H = 1660;
const C = {
  accion: ['#eaf2fb', '#2f5b93'],
  rechazo: ['#fbe5e5', '#b03a3a'],
  ok: ['#e2f3e2', '#3a8a3a'],
  decision: ['#fff3d6', '#b8862b'],
};
const LANE = [{ x: 22, name: 'Estudiante', bg: '#f3f7fc' }, { x: 486, name: 'Sistema ATENEA', bg: '#ffffff' }, { x: 950, name: 'Docente (tribunal)', bg: '#f3f7fc' }];
const LW = 464, TOP = 65, HEAD = 40, BOTTOM = H - 30;
const EST = 254, SIS = 718, DOC = 1182;

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
let svg = '';

function lines(arr, cx, cy, size = 15, extra = '') {
  const gap = size * 1.35, y0 = cy - (arr.length - 1) * gap / 2;
  return arr.map((l, i) => `<text x="${cx}" y="${y0 + i * gap}" font-size="${size}" text-anchor="middle" dominant-baseline="middle" ${extra}>${esc(l)}</text>`).join('');
}
function box(cx, cy, txt, kind = 'accion', w = 248, h = 68) {
  const [f, s] = C[kind];
  svg += `<rect x="${cx - w / 2}" y="${cy - h / 2}" width="${w}" height="${h}" rx="14" fill="${f}" stroke="${s}" stroke-width="2"/>` + lines(txt, cx, cy);
}
function diamond(cx, cy, txt, w = 270, h = 112) {
  const [f, s] = C.decision;
  svg += `<polygon points="${cx},${cy - h / 2} ${cx + w / 2},${cy} ${cx},${cy + h / 2} ${cx - w / 2},${cy}" fill="${f}" stroke="${s}" stroke-width="2"/>`;
  if (txt) svg += lines(txt, cx, cy, 14);
}
function flow(pts, arrow = true) {
  svg += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="#333" stroke-width="2" ${arrow ? 'marker-end="url(#flecha)"' : ''}/>`;
}
function guard(x, y, t) {
  svg += `<text x="${x}" y="${y}" font-size="14" font-weight="bold" text-anchor="middle" fill="#7a4a00">${esc(t)}</text>`;
}
function start(cx, cy) { svg += `<circle cx="${cx}" cy="${cy}" r="12" fill="#111"/>`; }
function end(cx, cy) { svg += `<circle cx="${cx}" cy="${cy}" r="14" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="8" fill="#111"/>`; }

// Carriles
LANE.forEach(l => {
  svg += `<rect x="${l.x}" y="${TOP}" width="${LW}" height="${BOTTOM - TOP}" fill="${l.bg}" stroke="#555" stroke-width="1.5"/>`;
  svg += `<rect x="${l.x}" y="${TOP}" width="${LW}" height="${HEAD}" fill="#dce8f8" stroke="#555" stroke-width="1.5"/>`;
  svg += `<text x="${l.x + LW / 2}" y="${TOP + HEAD / 2}" font-size="18" font-weight="bold" text-anchor="middle" dominant-baseline="middle">${esc(l.name)}</text>`;
});
svg += `<text x="${W / 2}" y="30" font-size="22" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Diagrama de actividades: inscripción y rendición de final</text>`;

// Inscripción
start(EST, 140);
flow([[EST, 152], [EST, 236]]);
box(EST, 270, ['Consultar las mesas de', 'final disponibles (RF20)']);
flow([[EST, 304], [EST, 330], [SIS, 330], [SIS, 356]]);
box(SIS, 400, ['Mostrar solo mesas con', 'materia regular y', 'regularidad vigente'], 'accion', 248, 88);
flow([[SIS, 444], [SIS, 470], [EST, 470], [EST, 500]]);
box(EST, 534, ['Inscribirse a una mesa de', 'final (RF21)']);
flow([[EST, 568], [EST, 590], [SIS, 590], [SIS, 608]]);
diamond(SIS, 664, ['¿Regularidad vigente y', 'mesa con inscripción', 'abierta?']);
flow([[SIS, 720], [SIS, 742], [604, 742], [604, 764]], false);
flow([[604, 742], [604, 764]]);
flow([[SIS, 742], [831, 742], [831, 764]]);
guard(560, 735, '[no]');
guard(880, 735, '[sí]');

// Rechazo
box(604, 798, ['Rechazar e informar', 'el motivo'], 'rechazo', 194, 68);
flow([[507, 798], [380, 798]]);
box(EST, 798, ['Ver el motivo', 'del rechazo'], 'rechazo', 248, 68);
flow([[EST, 832], [EST, 872]]);
end(EST, 888);

// Inscripción registrada y examen
box(831, 798, ['Registrar la', 'inscripción'], 'accion', 194, 68);
flow([[831, 832], [831, 945], [EST, 945], [EST, 966]]);
box(EST, 1000, ['Rendir el examen final']);
flow([[378, 1000], [1056, 1000]]);
box(DOC, 1000, ['Cargar la nota del final', 'como tribunal (RF17)']);
flow([[DOC, 1034], [DOC, 1062], [SIS, 1062], [SIS, 1084]]);
diamond(SIS, 1140, ['¿Cómo terminó', 'el examen? (RN06)']);

// Tres salidas
const R = 1265, X1 = 568, X3 = 868;
flow([[SIS, 1196], [SIS, 1231]]);
flow([[SIS, 1214], [X1, 1214], [X1, 1231]]);
flow([[SIS, 1214], [X3, 1214], [X3, 1231]]);
guard(X1 + 20, 1206, '[nota ≥ 6]');
guard(SIS + 48, 1226, '[ausente]');
guard(X3 - 20, 1206, '[nota < 6]');
box(X1, R, ['Marcar el final', 'como aprobado'], 'ok', 140, 68);
box(SIS, R, ['Registrar', 'ausente'], 'accion', 140, 68);
box(X3, R, ['Marcar el final', 'como desaprobado'], 'rechazo', 140, 68);

// Nodo de unión (merge)
const MY = 1370;
flow([[X1, R + 34], [X1, MY], [SIS - 22, MY]]);
flow([[SIS, R + 34], [SIS, MY - 24]]);
flow([[X3, R + 34], [X3, MY], [SIS + 22, MY]]);
diamond(SIS, MY, null, 44, 44);

flow([[SIS, MY + 22], [SIS, 1420], [EST, 1420], [EST, 1446]]);
box(EST, 1480, ['Consultar finales rendidos', 'y la nota obtenida (RF24)']);
flow([[EST, 1514], [EST, 1560]]);
end(EST, 1576);

const full = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="${W}" height="${H}" fill="#ffffff"/>${svg}</svg>`;
document.getElementById('actividades').innerHTML = full;

document.getElementById('descargar').addEventListener('click', () => {
  const img = new Image();
  img.onload = () => {
    const scale = 2;
    const canvas = document.createElement('canvas');
    canvas.width = W * scale; canvas.height = H * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0, W, H);
    const a = document.createElement('a');
    a.download = 'diagrama-actividades.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(full);
});
</script>
</body>
</html>
